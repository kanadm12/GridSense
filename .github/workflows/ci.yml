name: GridSense CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11.16"
  NODE_VERSION: "22.20.0"
  DEBUG: "true"
  SECRET_KEY: test-secret-key-for-ci-only

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml', 'backend/requirements-dev.lock') }}

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run Ruff linter
        run: python -m ruff check app tests

      - name: Check imports can be loaded
        run: |
          python -c "from app.main import app; print('✓ Main app imports OK')"
          python -c "from app.api.errors import ErrorCode; print('✓ Error handling imports OK')"
          python -c "from app.logging_config import setup_logging; print('✓ Logging imports OK')"

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridsense_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml', 'backend/requirements-dev.lock') }}

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Provision restricted PostgreSQL integration database
        id: pg-provision
        env:
          # Service-container administrator: used only by the provisioning and teardown
          # steps. The pytest step does not receive these variables.
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: python scripts/ci_postgres_integration.py provision --env-file "$GITHUB_ENV"

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: true
        run: |
          set -o pipefail
          # DATABASE_URL stays unset (SQLite default), as in the verified local run. The
          # integration fixtures use the restricted GRIDSENSE_INTEGRATION_* variables that
          # the provisioning step wrote to the job environment.
          pytest tests/integration --collect-only -q -p no:cacheprovider \
            | tee "$RUNNER_TEMP/integration-collected.txt"
          pytest -v -rs --cov=app --cov-report=xml --cov-report=term \
            --junitxml="$RUNNER_TEMP/pytest-junit.xml" \
            2>&1 | tee "$RUNNER_TEMP/backend-pytest.log"
          if grep -Eiq "Windows fatal exception|access violation|Fatal Python error" "$RUNNER_TEMP/backend-pytest.log"; then
            echo "Native runtime diagnostic found in pytest output" >&2
            exit 1
          fi

      - name: Verify integration tests ran without skips
        run: >-
          python scripts/verify_pytest_report.py
          --junit "$RUNNER_TEMP/pytest-junit.xml"
          --collected "$RUNNER_TEMP/integration-collected.txt"
          --integration-dir tests/integration

      - name: Verify disposable schemas were cleaned up
        if: always() && steps.pg-provision.outcome == 'success'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: python scripts/ci_postgres_integration.py verify-teardown

      - name: Preserve backend test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-evidence
          path: |
            ${{ runner.temp }}/pytest-junit.xml
            ${{ runner.temp }}/integration-collected.txt
            ${{ runner.temp }}/backend-pytest.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  migration-check:
    name: Database Migration Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridsense_migration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock

      - name: Upgrade complete chain
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gridsense_migration_test
        run: alembic upgrade head

      - name: Verify migration head
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gridsense_migration_test
        run: alembic current

      - name: Verify full downgrade and re-upgrade
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gridsense_migration_test
        run: |
          alembic downgrade base
          alembic upgrade head

  mobile-lint:
    name: Mobile Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Node modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('mobile/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Export Expo web app
        run: npm run export:web -- --output-dir "$RUNNER_TEMP/expo-web"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          push: false
          tags: gridsense-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Compose config
        run: docker compose config

  integration-test:
    name: Integration Test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend-test, docker-build]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install locked smoke-test dependencies
        working-directory: ./backend
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Start services
        run: docker compose up --build -d

      - name: Wait for API readiness
        run: |
          for _ in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8000/health/ready; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Run staging smoke test
        run: |
          python backend/scripts/staging_smoke.py \
            --base-url http://localhost:8000 \
            --sample-file backend/tests/sample_nem12.csv \
            --timeout-seconds 90

      - name: Collect service logs on failure
        if: failure()
        run: docker compose logs --tail=300 api worker scheduler db redis

      - name: Cleanup
        if: always()
        run: docker compose down -v

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install hash-locked pip-audit tool environment
        working-directory: ./backend
        run: python -m pip install --require-hashes -r requirements-audit.lock

      # Findings are not ignored here. The gate step below decides, using only
      # APPROVED, unexpired entries in backend/security/risk-acceptances.json.
      - name: Audit locked backend dependencies (pip-audit)
        id: pip-audit
        continue-on-error: true
        working-directory: ./backend
        run: >-
          mkdir -p "$RUNNER_TEMP/scan-out" && pip-audit --requirement requirements-dev.lock --require-hashes --progress-spinner off
          --format json --output "$RUNNER_TEMP/scan-out/pip-audit.json"

      - name: Stage application lock as a recognised Trivy input
        working-directory: ./backend
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner-input" "$RUNNER_TEMP/scan-out"
          cp requirements-dev.lock "$RUNNER_TEMP/scanner-input/requirements.txt"
          original="$(sha256sum requirements-dev.lock | cut -d' ' -f1)"
          staged="$(sha256sum "$RUNNER_TEMP/scanner-input/requirements.txt" | cut -d' ' -f1)"
          test "$original" = "$staged"
          echo "Staged lock SHA256: $staged"

      # Trivy image is pinned by digest. Vulnerability evidence is written as JSON
      # (with the recognised package list) and SARIF; the gate step enforces policy.
      - name: Trivy vulnerability scan (JSON evidence)
        env:
          TRIVY_IMAGE: aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/scanner-input:/scan:ro" -v "$RUNNER_TEMP/scan-out:/out" \
            "$TRIVY_IMAGE" fs --skip-version-check --scanners vuln --list-all-pkgs \
            --format json --output /out/trivy-results.json /scan

      - name: Trivy vulnerability scan (SARIF)
        id: trivy-sarif
        env:
          TRIVY_IMAGE: aquasec/trivy:0.66.0@sha256:086971aaf400beebd94e8300fd8ea623774419597169156cec56eec5b00dfb1e
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/scanner-input:/scan:ro" -v "$RUNNER_TEMP/scan-out:/out" \
            "$TRIVY_IMAGE" fs --skip-version-check --scanners vuln \
            --format sarif --output /out/trivy-results.sarif /scan

      # hashFiles() only sees files inside GITHUB_WORKSPACE, so it can never match a file
      # under runner.temp. Depend on the generating step's outcome instead.
      - name: Upload Trivy SARIF
        if: ${{ always() && steps.trivy-sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: ${{ runner.temp }}/scan-out/trivy-results.sarif

      - name: Preserve scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-scan-evidence
          path: ${{ runner.temp }}/scan-out/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce security gate
        working-directory: ./backend
        run: >-
          python scripts/security_gate.py
          --lock requirements-dev.lock
          --register security/risk-acceptances.json
          --pip-audit "$RUNNER_TEMP/scan-out/pip-audit.json"
          --trivy "$RUNNER_TEMP/scan-out/trivy-results.json"
          --trivy-packages "$RUNNER_TEMP/scan-out/trivy-results.json"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-test, mobile-lint, integration-test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy to staging server
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          # Add SSH key
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Deploy via SSH
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "deploy@$STAGING_HOST" << 'EOF'
            cd /opt/gridsense
            git pull origin develop
            docker compose build
            docker compose run --rm api alembic upgrade head
            docker compose up -d
          EOF

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-test, mobile-lint, integration-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Deploy to production server
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          # Add SSH key
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Deploy via SSH with zero-downtime
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "deploy@$PRODUCTION_HOST" << 'EOF'
            cd /opt/gridsense
            git pull origin main
            docker compose build
            docker compose run --rm api alembic upgrade head
            
            # Rolling restart (zero-downtime)
            for i in {1..4}; do
              docker compose up -d --no-deps --scale api=$i api
              sleep 10
            done
            
            docker compose restart worker scheduler
          EOF

      - name: Verify deployment
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          sleep 30  # Wait for services to stabilize
          curl -f "$PRODUCTION_URL/health/ready" || exit 1

      - name: Notify deployment
        if: success()
        run: |
          echo "Production deployment successful" | \
            mail -s "GridSense Production Deployed" ops@example.com
